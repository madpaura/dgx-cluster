# dgxctl control plane. Runs on ONE management server with no GPUs; it reaches
# the DGX boxes and RTX workstations over SSH.
#
#   cp .env.example .env   # then edit
#   docker compose up -d --build
#   open http://<this-host>:8080
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dgxctl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dgxctl}
      POSTGRES_DB: dgxctl
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Gives LiteLLM its own database; see the script for why that matters.
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dgxctl"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # This box holds node inventory and the audit log, not model weights —
    # a small, fixed footprint. Capped so a runaway query degrades one
    # container instead of starving the host it shares with the GPU driver.
    mem_limit: 1g
    cpus: "1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DGXCTL_DATABASE_URL: postgresql+asyncpg://dgxctl:${POSTGRES_PASSWORD:-dgxctl}@postgres:5432/dgxctl
      DGXCTL_SECRET_KEY: ${DGXCTL_SECRET_KEY:?set DGXCTL_SECRET_KEY in .env}
      DGXCTL_DRIVER: ${DGXCTL_DRIVER:-sim}
      DGXCTL_SSH_USER: ${DGXCTL_SSH_USER:-root}
      DGXCTL_SSH_KEY_PATH: /run/secrets/fleet_key
      # Empty (the default) accepts whatever host key a node presents. Set
      # DGXCTL_SSH_KNOWN_HOSTS=/run/secrets/known_hosts in .env, alongside the
      # mount below, once you have captured real host keys.
      DGXCTL_SSH_KNOWN_HOSTS: ${DGXCTL_SSH_KNOWN_HOSTS:-}
      DGXCTL_MCP_ROLE: ${DGXCTL_MCP_ROLE:-admin}
      DGXCTL_VLLM_IMAGE: ${DGXCTL_VLLM_IMAGE:-vllm/vllm-openai:latest}
      DGXCTL_HF_CACHE_DIR: ${DGXCTL_HF_CACHE_DIR:-/opt/hf-cache}
      DGXCTL_HF_TOKEN: ${DGXCTL_HF_TOKEN:-}
      DGXCTL_LITELLM_BASE_URL: http://litellm:4000
      DGXCTL_LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      DGXCTL_LITELLM_PUBLIC_URL: ${DGXCTL_LITELLM_PUBLIC_URL:-http://localhost:${LITELLM_PORT:-4000}}
      DGXCTL_AUTH_MODE: ${DGXCTL_AUTH_MODE:-dev}
      DGXCTL_MCP_ENABLED: ${DGXCTL_MCP_ENABLED:-true}
      DGXCTL_MCP_TOKEN: ${DGXCTL_MCP_TOKEN:-}
      DGXCTL_MCP_ALLOWED_HOSTS: ${DGXCTL_MCP_ALLOWED_HOSTS:-*}
      DGXCTL_OIDC_ISSUER: ${DGXCTL_OIDC_ISSUER:-}
      DGXCTL_OIDC_CLIENT_ID: ${DGXCTL_OIDC_CLIENT_ID:-}
      DGXCTL_OIDC_CLIENT_SECRET: ${DGXCTL_OIDC_CLIENT_SECRET:-}
      DGXCTL_OIDC_ADMIN_GROUPS: ${DGXCTL_OIDC_ADMIN_GROUPS:-gpu-admins}
      DGXCTL_OIDC_DEPLOYER_GROUPS: ${DGXCTL_OIDC_DEPLOYER_GROUPS:-gpu-deployers}
      DGXCTL_PUBLIC_URL: ${DGXCTL_PUBLIC_URL:-http://localhost:8080}
    volumes:
      # The control server's SSH key. Must be in authorized_keys on every node.
      - ${FLEET_SSH_KEY:-./secrets/fleet_key}:/run/secrets/fleet_key:ro
      # The public half too: installing the key on a new node means appending
      # this to its authorized_keys, so the API has to be able to read it.
      - ${FLEET_SSH_KEY:-./secrets/fleet_key}.pub:/run/secrets/fleet_key.pub:ro
      # Only read if DGXCTL_SSH_KNOWN_HOSTS above points here. Build it with
      # `ssh-keyscan -H <node> >> secrets/known_hosts` for every node; an empty
      # file at the default path is harmless while the feature is unused.
      - ${SSH_KNOWN_HOSTS_FILE:-./secrets/known_hosts}:/run/secrets/known_hosts:ro
    ports:
      # Bound to loopback by default: DGXCTL_AUTH_MODE defaults to "dev", which
      # trusts every request as admin, so publishing this on the LAN by
      # default would make a fresh install an open control plane. Set
      # DGXCTL_BIND_ADDRESS=0.0.0.0 once auth is actually configured.
      - "${DGXCTL_BIND_ADDRESS:-127.0.0.1}:${DGXCTL_PORT:-8080}:8000"
    restart: unless-stopped
    # The control plane itself is a thin FastAPI process; GPU work happens on
    # the fleet, not here. Capped mainly to contain a leak, not to pinch it.
    mem_limit: 1g
    cpus: "2"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-${LITELLM_MASTER_KEY}}
      # A SEPARATE database from dgxctl's. Prisma drops unknown tables in the
      # schema it migrates, so sharing one destroys the fleet inventory.
      DATABASE_URL: postgresql://dgxctl:${POSTGRES_PASSWORD:-dgxctl}@postgres:5432/litellm
      STORE_MODEL_IN_DB: "True"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "4"]
    ports:
      # See the api service above: loopback by default, deliberately opened.
      - "${DGXCTL_BIND_ADDRESS:-127.0.0.1}:${LITELLM_PORT:-4000}:4000"
    healthcheck:
      # No curl/wget in this image (Wolfi base); it does ship its own Python.
      # /health/readiness is the same endpoint app/services/litellm.py polls.
      test: ["CMD", "python3", "-c",
             "import urllib.request as u; u.urlopen('http://localhost:4000/health/readiness', timeout=5)"]
      interval: 10s
      timeout: 10s
      # Prisma migrations plus proxy boot take ~90s; failing health checks
      # during that window would otherwise flap the container's state.
      start_period: 100s
      retries: 6
    restart: unless-stopped
    mem_limit: 2g
    cpus: "2"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
