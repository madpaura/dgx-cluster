<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>dgxctl — GPU fleet</title>
    <script>
      // Apply the saved theme before first paint, so there is no flash of the
      // default palette on reload.
      try {
        var t = localStorage.getItem("dgxctl.theme");
        document.documentElement.dataset.theme =
          ["nexus", "crextio", "midnight"].indexOf(t) >= 0 ? t : "nexus";
      } catch (e) {
        document.documentElement.dataset.theme = "nexus";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
