[project]
name = "dgxctl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "asyncssh>=2.18",
  "httpx>=0.27",
  "authlib>=1.3",
  "itsdangerous>=2.2",
  "python-jose[cryptography]>=3.3",
  "greenlet>=3.1",
]

[tool.setuptools.packages.find]
include = ["app*"]
